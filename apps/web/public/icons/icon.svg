<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Browser-tab favicon: the bare Hibiscus-Notch mark (bubble + tail + amber
       dots), no background plate — matches NakTahuMark.tsx exactly so the tab
       icon and the in-app header logo read as the same mark. The maskable
       platform icons (apple-touch-icon.png, manifest.json's PNG set) keep
       their own background plate separately, since those need one. -->
