# Railway service configuration — lives in apps/api/ (service root directory)
# Docs: https://docs.railway.app/reference/config-as-code
#
# dockerfilePath is relative to the BUILD CONTEXT Railway actually uses,
# which is the full repo root, NOT apps/api — confirmed empirically: with
# the dashboard's "Root Directory" (Settings -> Source) cleared to empty,
# the build log showed a ~3 MB unpacked archive (the whole monorepo) and
# still failed to find a plain "Dockerfile", proving Railway's build
# pipeline reads from the repo root regardless of this service's working
# directory in .github/workflows/deploy.yml (that workflow's `railway up
# --detach` triggers the build; it does not itself define the build
# context the way `docker build <context>` would). So the path here must
# include the apps/api/ prefix.
#
# Do not "fix" this back to "Dockerfile" without first confirming in the
# Railway dashboard build log whether the unpacked archive size looks like
# apps/api alone (~1 MB) or the full repo (~3 MB) — that determines which
# form of this path is correct, and it flipped once already when the
# dashboard Root Directory setting changed.

[build]
  builder        = "DOCKERFILE"
  dockerfilePath = "apps/api/Dockerfile"

[deploy]
  healthcheckPath         = "/health"
  healthcheckTimeout      = 30
  restartPolicyType       = "ON_FAILURE"
  restartPolicyMaxRetries = 3
