[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "routers", "routes", "services", "middleware", "rag"]
py-modules = ["main"]

[project]
name = "naktahu-api"
version = "0.1.0"
description = "Naktahu query API with SSE, auth, and history"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-jose[cryptography]>=3.3.0",
  "PyJWT[crypto]>=2.9.0",
  "redis>=5.2.0",
  "supabase>=2.10.0",
  "slowapi>=0.1.9",
  "structlog>=24.4.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "openai>=1.40.0",
  "pandas>=2.2.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
