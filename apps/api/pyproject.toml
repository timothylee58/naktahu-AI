[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naktahu-api"
version = "0.1.0"
description = "NakTahu AI — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.52.0,<1.0",
    "openai>=1.60.0,<2.0",
    "supabase>=2.13.0",
    "redis>=5.2.0",
    "langchain-core>=0.3.30",
    "langchain>=0.3.14",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.14",
    "langchain-anthropic>=0.3.5",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.8",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT[crypto]>=2.10.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "weave>=0.51.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.28.0",
    "google-auth>=2.37.0",
    "google-cloud-speech>=2.29.0",
    "stripe>=11.5.0,<12.0",
    "python-multipart>=0.0.18",
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    # beautifulsoup4 belongs in core deps, not the optional `ingest` extra:
    # scripts/ingest_parliament/fetch_hansard.py is imported unconditionally
    # by tests/test_hansard_ingestion.py in the main test suite, and CI's
    # pytest job installs only `.[dev]` (never `.[ingest]`) — bs4 must be
    # present whenever `dev` is installed or collection fails outright.
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "anyio[trio]>=4.8.0",
    "pandas>=2.2.0",
]
ingest = [
    "pandas>=2.2.0",
    "httpx>=0.28.0",
    "langchain-text-splitters>=0.3.4",
    "lxml>=5.3.0",
    "pycld2>=0.41",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "core*", "routers*", "routes*", "services*", "middleware*", "rag*", "scripts*"]
