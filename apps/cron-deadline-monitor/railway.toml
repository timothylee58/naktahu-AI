# Railway cron service — nightly Deadline Monitor (02:00 MYT = 18:00 UTC).
# Service root in Railway dashboard: apps/cron-deadline-monitor
# Docs: https://docs.railway.app/reference/config-as-code

[build]
  builder = "DOCKERFILE"

[deploy]
  cronSchedule      = "0 18 * * *"
  startCommand      = "python scripts/agents/deadline_monitor.py"
  restartPolicyType = "NEVER"
