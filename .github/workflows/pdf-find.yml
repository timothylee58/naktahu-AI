name: PDF find

# Read-only. Downloads a gov.my PDF on a GitHub runner (the build sandbox cannot reach gov
# sites) and prints the text around phrases. Manual: dispatch it, or push a change to
# .github/pdf-find-trigger.txt on a claude/** branch. That file: a `url=` line, then a
# `find=` line with phrases separated by semicolons.

on:
  workflow_dispatch:
    inputs:
      url:
        type: string
        required: true
      find:
        description: "Phrases separated by semicolons"
        type: string
        required: true
  push:
    branches: ["claude/**"]
    paths: [".github/pdf-find-trigger.txt"]

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx pypdf
      - name: Find
        working-directory: .
        env:
          IN_URL: ${{ github.event.inputs.url }}
          IN_FIND: ${{ github.event.inputs.find }}
        run: |
          set -o pipefail
          u="$IN_URL"; f="$IN_FIND"
          if [ -z "$u" ]; then u=$(sed -n 's/^url=//p' .github/pdf-find-trigger.txt | head -n1); fi
          if [ -z "$f" ]; then f=$(sed -n 's/^find=//p' .github/pdf-find-trigger.txt | head -n1); fi
          IFS=';' read -ra phrases <<< "$f"
          cd apps/api
          python -m scripts.pdf_find "$u" "${phrases[@]}" | tee "$RUNNER_TEMP/out.txt"
          { echo '### PDF find'; echo '```'; cat "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
