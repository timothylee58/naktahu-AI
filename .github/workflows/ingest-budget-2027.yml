name: Ingest Belanjawan 2027

# Budget 2027 is tabled on 9 October 2026 (afternoon, MYT). Its PDFs are
# registered in apps/api/scripts/sources.py (BUDGET_2027_SOURCES) with
# available_from=2026-10-09, so before that date every run here prints an
# UPCOMING countdown and fetches nothing.
#
# The weekly ingest-sources.yml would first see the PDFs on Sunday 11 Oct;
# this runs daily 9–16 Oct at 20:00 MYT so the first check happens the
# evening the speech is delivered. Scheduled runs are --dry-run: a human
# reads the log (page count, domain routing split, that the text is the
# speech and not an error page), then re-runs via workflow_dispatch with
# write_mode=live. A 404 after 9 Oct means MOF changed its file naming —
# fix the URL in sources.py rather than guessing further.

on:
  schedule:
    - cron: "0 12 9-16 10 *"  # 12:00 UTC = 20:00 MYT, 9–16 October
  workflow_dispatch:
    inputs:
      write_mode:
        description: "dry-run (parse + embed, no Supabase write) or live (actually write)"
        type: choice
        options:
          - dry-run
          - live
        default: dry-run

jobs:
  ingest:
    name: Ingest Budget 2027 PDFs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install --ignore-installed PyJWT -e "."

      - name: Ingest each Budget 2027 source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ILMU_API_KEY: ${{ secrets.ILMU_API_KEY }}
        run: |
          WRITE_MODE="${{ github.event.inputs.write_mode || 'dry-run' }}"
          DRY_RUN_FLAG="--dry-run"
          if [ "$WRITE_MODE" = "live" ]; then
            DRY_RUN_FLAG=""
          fi

          NAMES=$(python -c "from scripts.sources import BUDGET_2027_SOURCES; print(' '.join(s.name for s in BUDGET_2027_SOURCES))")

          status=0
          for name in $NAMES; do
            echo "::group::Ingesting $name ($WRITE_MODE)"
            # A speech is ~60 pages — well past the default 50-chunk limit.
            python -m scripts.ingest_feed --source "$name" --limit 1000 $DRY_RUN_FLAG || status=1
            echo "::endgroup::"
          done
          exit $status
