name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── Deploy Next.js frontend to Netlify ───────────────────────────────────
  deploy-web:
    name: Deploy web → Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=optional

      - name: Build Next.js app
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Netlify (production)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: apps/web/.next
          production-branch: main
          production-deploy: true
          netlify-config-path: netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ── Deploy FastAPI + Redis to Railway ────────────────────────────────────
  # There is deliberately no job here. Railway's own GitHub integration
  # (Settings -> Source -> "Auto deploys when pushed to GitHub", connected
  # to timothylee58/naktahu-AI, branch main) already deploys this service
  # on every push — that path clones from GitHub server-side and resolves
  # the Dockerfile relative to the dashboard's Root Directory (/apps/api).
  #
  # A `railway up` CLI step used to run here as well, uploading a snapshot
  # from `working-directory: apps/api`. That is a SEPARATE, incompatible
  # context-resolution mechanism: the CLI-uploaded snapshot is already
  # scoped to apps/api's contents, and Railway then applies the dashboard
  # Root Directory (/apps/api) a second time on top of that snapshot,
  # permanently double-nesting the path no matter what dockerfilePath is
  # set to in apps/api/railway.toml. This is what caused the "railway up"
  # deploy history entries to fail even after the native auto-deploy for
  # the exact same commit succeeded (see apps/api/railway.toml's comment
  # for the full incident history — a Root Directory typo, "/app/api" vs
  # "/apps/api", was chased across three PRs before this redundant/
  # conflicting CLI step turned out to be the remaining failure mode).
  #
  # Do not re-add a `railway up` CLI step unless the native GitHub
  # integration is disabled first — running both together will always
  # produce one broken deploy attempt per push, race condition or not.
