name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── Deploy Next.js frontend to Netlify ───────────────────────────────────
  deploy-web:
    name: Deploy web → Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=optional

      - name: Build Next.js app
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Netlify (production)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: apps/web/.next
          production-branch: main
          production-deploy: true
          netlify-config-path: netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ── Deploy FastAPI + Redis to Railway ────────────────────────────────────
  # Deliberately does NOT `needs: deploy-web` — Railway and Netlify are
  # independent deploy targets with independent auth. A Netlify-specific
  # failure (e.g. an expired NETLIFY_AUTH_TOKEN) must never block the
  # backend from receiving a fix just because it happens to run in the same
  # workflow file. This exact case already happened: deploy-web failed on
  # Netlify auth while the Next.js build itself succeeded, and the previous
  # `needs: deploy-web` silently skipped every Railway deploy as a result.
  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: apps/api
        run: railway up --service f98c0049-c3f4-4ee9-bf29-42aa220cdc16 --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # RAILWAY_TOKEN — a Project Token (Railway dashboard → project →
        # Settings → Tokens), already scoped to one project+environment.
        # --service is required (the project also has a Redis service, so
        # `railway up` without --service fails with "Multiple services
        # found"). Using the service ID rather than name: `railway status
        # --json` (run once as a diagnostic step, since removed) showed the
        # API service's actual name is literally "@naktahu-ai" (with an "@"
        # prefix) — neither "naktahu-ai" nor "naktahu-AI" ever matched it.
        # The ID is stable and immune to any further name/casing surprises.

  # ── Deadline Monitor cron (02:00 MYT daily) ───────────────────────────────
  deploy-deadline-cron:
    name: Deploy cron → Railway
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Resolve Deadline Monitor Railway service
        id: deadline-cron-service
        run: |
          STATUS_JSON="$(railway status --json)"
          SERVICE_ID="$(STATUS_JSON="$STATUS_JSON" python - <<'PY'
          import json
          import os
          import sys

          data = json.loads(os.environ["STATUS_JSON"])
          services = []

          def visit(node):
              if isinstance(node, dict):
                  name = node.get("name")
                  service_id = node.get("id")
                  if isinstance(name, str) and isinstance(service_id, str):
                      services.append((name, service_id))
                  for value in node.values():
                      visit(value)
              elif isinstance(node, list):
                  for item in node:
                      visit(item)

          visit(data)

          deduped = []
          seen = set()
          for name, service_id in services:
              if service_id in seen:
                  continue
              seen.add(service_id)
              deduped.append((name, service_id))

          preferred_names = {"naktahu-deadline-cron", "@naktahu-deadline-cron"}
          matches = [item for item in deduped if item[0] in preferred_names]

          if not matches:
              matches = [
                  item for item in deduped
                  if "deadline" in item[0].lower() and "cron" in item[0].lower()
              ]

          if not matches:
              matches = [item for item in deduped if "deadline" in item[0].lower()]

          if len(matches) == 1:
              print(matches[0][1])
              sys.exit(0)

          if not matches:
              raise SystemExit("Could not find a Railway service matching deadline cron.")

          names = ", ".join(name for name, _ in matches)
          raise SystemExit(f"Found multiple candidate Railway services: {names}")
          PY
          )"

          echo "service_id=$SERVICE_ID" >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Deadline Monitor cron
        working-directory: apps/cron-deadline-monitor
        run: railway up --service ${{ steps.deadline-cron-service.outputs.service_id }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
