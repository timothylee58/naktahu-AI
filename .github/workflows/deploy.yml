name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── Deploy Next.js frontend to Netlify ───────────────────────────────────
  deploy-web:
    name: Deploy web → Netlify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Netlify (production)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: apps/web/.next
          production-branch: main
          production-deploy: true
          netlify-config-path: netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ── Deploy FastAPI + Redis to Render ─────────────────────────────────────
  deploy-api:
    name: Deploy API → Render
    runs-on: ubuntu-latest
    needs: deploy-web
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl --silent --show-error --fail \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # RENDER_DEPLOY_HOOK_URL — from Render dashboard → Service → Settings → Deploy Hook
