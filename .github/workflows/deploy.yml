name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # ── Deploy Next.js frontend to Netlify ───────────────────────────────────
  deploy-web:
    name: Deploy web → Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=optional

      - name: Build Next.js app
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: Deploy to Netlify (production)
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: apps/web/.next
          production-branch: main
          production-deploy: true
          netlify-config-path: netlify.toml
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # ── Deploy FastAPI + Redis to Railway ────────────────────────────────────
  # Deliberately does NOT `needs: deploy-web` — Railway and Netlify are
  # independent deploy targets with independent auth. A Netlify-specific
  # failure (e.g. an expired NETLIFY_AUTH_TOKEN) must never block the
  # backend from receiving a fix just because it happens to run in the same
  # workflow file. This exact case already happened: deploy-web failed on
  # Netlify auth while the Next.js build itself succeeded, and the previous
  # `needs: deploy-web` silently skipped every Railway deploy as a result.
  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: apps/api
        run: railway up --service naktahu-ai --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # RAILWAY_TOKEN — from Railway dashboard → Account Settings → Tokens
        # Service name must match the Railway service exactly (case-sensitive):
        # the backend service in the naktahu-ai project is named "naktahu-ai".

  # ── Deadline Monitor cron (02:00 MYT daily) ───────────────────────────────
  deploy-deadline-cron:
    name: Deploy cron → Railway
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Deadline Monitor cron
        working-directory: apps/cron-deadline-monitor
        run: railway up --service naktahu-deadline-cron --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
