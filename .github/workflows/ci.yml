name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "claude/**"

jobs:
  # ── TypeScript typecheck ──────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tsc --noEmit
        run: npm run typecheck

  # ── Next.js production build ──────────────────────────────────────────────
  build-web:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --include=optional

      - name: Build Next.js app
        working-directory: apps/web
        run: npm run build
        env:
          # Placeholder values so build doesn't fail on missing env vars
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Python tests ──────────────────────────────────────────────────────────
  pytest:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: pip install --ignore-installed PyJWT -e ".[dev]" pyflakes

      - name: Lint Python (pyflakes — unused imports, undefined names, Trap #1)
        run: |
          pyflakes main.py app/main.py \
                    routers app/routers \
                    services app/services \
                    middleware app/middleware \
                    app/agents app/orchestration \
                    tests

      - name: Run pytest
        run: pytest tests/ -q
        env:
          PYTHONPATH: .

  # ── Eval gate: faithfulness (existing) + temporal_accuracy (new) ───────────
  # Faithfulness only checks answer-to-chunk consistency, so a stale chunk
  # reproduced perfectly passes it while being factually wrong. This job adds a
  # second deploy gate — average temporal_accuracy (chunk currency) — and records
  # both scores to the eval_runs table when Supabase creds are configured.
  eval-gate:
    name: Eval gate (faithfulness + temporal_accuracy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval deps
        run: pip install pytest "supabase>=2.10.0"

      - name: Run eval-metric + ingest-metadata tests
        run: pytest scripts/evals/ scripts/ingest/test_metadata.py -q
        env:
          PYTHONPATH: .

      - name: Run deploy eval gate
        # temporal_accuracy is computed offline from the golden samples;
        # faithfulness is enforced when FAITHFULNESS_SCORE is provided (from a
        # live RAGAS run) and skipped otherwise. Records to eval_runs when
        # SUPABASE creds are present.
        run: python -m scripts.evals.run_eval_gate --samples scripts/evals/data/temporal_golden.jsonl
        env:
          PYTHONPATH: .
          FAITHFULNESS_SCORE: ${{ secrets.FAITHFULNESS_SCORE }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
