# Root Railway config — forces Dockerfile build so Railway does not
# detect package.json and run Next.js instead of the Python API.
[build]
  builder        = "DOCKERFILE"
  dockerfilePath = "apps/api/Dockerfile"

[deploy]
  healthcheckPath         = "/health"
  healthcheckTimeout      = 30
  restartPolicyType       = "ON_FAILURE"
  restartPolicyMaxRetries = 3
