# Railway monorepo root configuration
# Docs: https://docs.railway.app/reference/config-as-code

[build]
  builder = "NIXPACKS"

[[services]]
  name   = "api"
  source = "apps/api"
  [services.deploy]
    startCommand    = "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthcheckPath = "/health"

[[services]]
  name  = "redis"
  image = "redis:7-alpine"
