# Railway project configuration (repo root)
# Set service Root Directory to "apps/api" in Railway dashboard.
# The authoritative config is at apps/api/railway.toml.

[build]
  builder = "DOCKERFILE"
  dockerfilePath = "apps/api/Dockerfile"
  dockerBuildContext = "apps/api"

[deploy]
  healthcheckPath = "/api/v1/health"
  healthcheckTimeout = 30
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
